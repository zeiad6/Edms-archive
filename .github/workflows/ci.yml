name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: jobs here only read the repo. Release writes live in release.yml.
permissions:
  contents: read

# A newer push to the same branch cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Run tests
        run: npx vitest run

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # TruffleHog is not an npm package (`npx @trufflesecurity/trufflehog`
      # 404s); run the official image. Scans the checkout before `npm ci` so
      # node_modules is not in scope; --fail exits non-zero on a live secret.
      - name: Check for secrets
        run: docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --only-verified --fail

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: Build
        # `next build` sets NODE_ENV=production and prerendering imports
        # src/lib/env.ts, which hard-fails without a >=32 char AUTH_SECRET.
        # Build-time placeholder only — the packaged app generates a fresh
        # per-install secret (electron/main.cjs:ensureAuthSecret).
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'build-only-placeholder-not-a-real-secret-0123456789abcdef' }}
        # Prerender opens file:./data/edms.db (SQLITE_CANTOPEN without the dir).
        run: mkdir -p data && npm run build
