name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Run tests
        run: npx vitest run

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check for secrets
        run: npx @trufflesecurity/trufflehog@main --no-update --only-verified --fail --regex --entropy --max-depth 5 .

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # See note above: the lockfile is generated on Linux and cannot
        # list Windows-only optional deps (electron-winstaller). Installing
        # with optional deps included keeps `npm ci` from rejecting the
        # lockfile as out of sync; the missing packages are not needed on
        # the jobs that run here.
        run: npm ci --include=optional

      - name: Build
        # `next build` sets NODE_ENV=production and prerendering imports
        # src/lib/env.ts, which hard-fails without a >=32 char AUTH_SECRET.
        # Build-time placeholder only — the packaged app generates a fresh
        # per-install secret (electron/main.cjs:ensureAuthSecret).
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'build-only-placeholder-not-a-real-secret-0123456789abcdef' }}
        run: npm run build
