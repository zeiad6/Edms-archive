name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Run tests
        run: npx vitest run

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check for secrets
        run: npx @trufflesecurity/trufflehog@main --no-update --only-verified --fail --regex --entropy --max-depth 5 .

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  windows-pack:
    runs-on: windows-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild

      - name: Build Next.js
        run: npm run build

      - name: Install Tesseract OCR (packaging dependency)
        run: choco install tesseract -y --no-progress

      - name: Pack Electron (NSIS + portable)
        env:
          TESSERACT_SRC: 'C:\Program Files\Tesseract-OCR'
        run: npm run electron:pack

      - name: Smoke-test installer (exists + NSIS integrity)
        shell: pwsh
        run: |
          Get-ChildItem dist/release
          $setup = Get-ChildItem dist/release/*Setup*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error 'NSIS Setup exe missing'; exit 1 }
          if ($setup.Length -lt 10MB) { Write-Error "Installer suspiciously small: $($setup.Length) bytes"; exit 1 }
          7z l $setup.FullName | Select-Object -First 20
          Write-Host "Smoke-test OK: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: edms-windows-installer
          path: dist/release/**
