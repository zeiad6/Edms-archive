name: Release (Windows x64)

# Publish a GitHub Release with correct UTF-8 Arabic notes + Latin-only asset names.
# Usage: git tag v1.0.0; git push origin v1.0.0
# The release body is read from RELEASE_NOTES.md (must stay UTF-8).
#
# Ships the Setup installer only. Nothing is published unless the tests pass
# AND the upgrade test proves that installing over v1.0.0 keeps user data.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=0

      # Includes src/lib/__tests__/upgrade-safety.test.ts: booting the new
      # version on an existing database must not change a single row or file.
      - name: Run tests
        run: npx vitest run

  release-windows:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild

      - name: Install Tesseract OCR (packaging dependency)
        run: choco install tesseract -y --no-progress

      # `choco install tesseract` ships only eng/osd — the Arabic model is a
      # separate download, and scripts/build-electron.cjs refuses to package
      # without ara.traineddata (an installer with no Arabic OCR is useless for
      # an Arabic-language EDMS). tessdata_fast matches what tesseract.exe
      # expects and is ~4 MB rather than the ~2 GB legacy model set.
      - name: Fetch Arabic OCR model and configs
        shell: pwsh
        run: |
          $dst = "C:\Program Files\Tesseract-OCR\tessdata"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $base = "https://github.com/tesseract-ocr/tessdata_fast/raw/main"
          foreach ($f in @("ara.traineddata", "eng.traineddata", "osd.traineddata")) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile (Join-Path $dst $f)
            Write-Host "fetched $f"
          }
          $configs = Join-Path $dst "configs"
          New-Item -ItemType Directory -Force -Path $configs | Out-Null
          $confBase = "https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/tessdata/configs"
          foreach ($c in @("pdf", "hocr", "tsv", "txt")) {
            Invoke-WebRequest -Uri "$confBase/$c" -OutFile (Join-Path $configs $c)
            Write-Host "fetched config $c"
          }

      - name: Pack Electron (NSIS Setup)
        env:
          TESSERACT_SRC: 'C:\Program Files\Tesseract-OCR'
        run: npm run electron:pack

      - name: Verify artifacts (Latin names, sane size)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          Get-ChildItem dist/release
          $setup = Get-ChildItem dist/release/EDMS-Archive-*-Setup-x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Error 'Setup exe with Latin name not found (check artifactName in electron-builder.yml)'; exit 1 }
          if ($setup.Length -lt 10MB) { Write-Error "Installer suspiciously small: $($setup.Length) bytes"; exit 1 }
          if (-not (Test-Path dist/release/latest.yml)) { Write-Error 'latest.yml missing — v1.0.0 installs would never see this update'; exit 1 }
          # The bundled Next server must be inside the app dir, not only in the
          # tree electron-builder packaged from: it is copied in by the
          # afterPack hook, and a missing server.js makes the packaged app quit
          # on launch with nothing but an exit code to show for it.
          foreach ($p in @(
            'dist/release/win-unpacked/resources/standalone/server.js',
            'dist/release/win-unpacked/resources/standalone/.next/BUILD_ID',
            'dist/release/win-unpacked/resources/tesseract/tesseract.exe')) {
            if (-not (Test-Path $p)) { Write-Error "packaged runtime file missing: $p"; exit 1 }
          }
          Write-Host "OK: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

      # Boot the freshly built, not-yet-installed app BEFORE the upgrade test.
      # Both tests below need the app to actually start, and this one fails in
      # seconds with full logs attached. Without it, a boot regression shows up
      # only as "new version exited on startup" ~9 minutes into the upgrade
      # test, buried under an install it has nothing to do with.
      - name: Boot smoke test (fresh build serves /api/health AND loads the window)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\release\win-unpacked\edms-archive.exe'
          if (-not (Test-Path $exe)) { Write-Error "unpacked app missing at $exe"; exit 1 }

          $smoke = Join-Path $env:RUNNER_TEMP 'edms-smoke'
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          $out = Join-Path $env:RUNNER_TEMP 'smoke-stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'smoke-stderr.log'

          # Read the logs defensively: when the app is still running (the
          # "never healthy" path) its redirected handles may deny a read.
          function Show-File($f) {
            try { Get-Content $f -Tail 60 -ErrorAction Stop | Out-String | Write-Host } catch { Write-Host "could not read $f : $($_.Exception.Message)" }
          }
          # The app keeps startup.log open for append, so a read can lose a race with a
          # write. Never let that abort the run: "not readable yet" means "not yet".
          function Test-Logged($f, $pattern) {
            if (-not $f -or -not (Test-Path $f)) { return $false }
            try { return [bool](Select-String -Path $f -Pattern $pattern -Quiet -ErrorAction Stop) }
            catch { return $false }
          }
                    # A renderer that dies with 0xC0000005 (STATUS_ACCESS_VIOLATION) gives
          # Electron no reason at all — the app only ever sees an exit code. The
          # Windows Application log records the faulting module, which is the
          # difference between "some native DLL" and an actual fix, so always
          # print it whenever the app dies.
          function Show-CrashDiagnostics {
            try {
              $since = (Get-Date).AddMinutes(-15)
              $evts = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction Stop |
                Where-Object { $_.Id -in 1000, 1001, 1026 } | Select-Object -First 8
              if (-not $evts) { Write-Host 'no Application Error events in the last 15 minutes'; return }
              foreach ($e in $evts) {
                $first = ($e.Message -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -First 4) -join ' | '
                Write-Host "event $($e.Id): $first"
              }
            } catch { Write-Host "could not read the Application event log: $($_.Exception.Message)" }
          }
          function Show-SmokeLogs {
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) { Write-Host "----- $(Split-Path $f -Leaf) -----"; Show-File $f }
            }
            # Search rather than guess: Electron's --user-data-dir handling of the
            # app-name subfolder differs between versions, and productName is
            # Arabic, so the exact path under $smoke is not worth hard-coding.
            $sl = Get-ChildItem $smoke -Recurse -Filter startup.log -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($sl) { Write-Host "----- startup.log ($sl) -----"; Show-File $sl }
            else { Write-Host "no startup.log under $smoke" }
            Show-CrashDiagnostics
          }

          # --user-data-dir keeps the smoke run out of %APPDATA%, so the upgrade
          # test below still starts from a genuine v1.0.0 install.
          # --disable-gpu: the runner has no GPU.
          # --no-sandbox: the Windows runner's sandboxed renderer cannot initialise,
          # which kills it with an access violation (0xC0000005) a few hundred ms
          # into the first load. Together these are the standard way to run a real
          # Electron build on a headless Windows agent.
          # Both apply to the test launch only; the shipped app keeps its sandbox
          # and hardware acceleration.
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process $exe -ArgumentList "--user-data-dir=$smoke", '--disable-gpu', '--no-sandbox' -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $healthy = $false
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { Show-SmokeLogs; Write-Error "fresh build exited on startup (code $($proc.ExitCode))"; exit 1 }
            $pids = (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*edms-archive*' }).Id
            $ports = Get-NetTCPConnection -State Listen -LocalAddress 127.0.0.1 -ErrorAction SilentlyContinue |
              Where-Object { $pids -contains $_.OwningProcess } | Select-Object -ExpandProperty LocalPort -Unique
            foreach ($port in $ports) {
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 10
                if ($r.ok) { if (-not $healthy) { Write-Host "health ok on port $port" }; $healthy = $true }
              } catch { }
            }
            # Resolve the log on each pass: the app creates it lazily, so a
            # path captured before the first write would stay $null forever.
            $log = Get-ChildItem $smoke -Recurse -Filter startup.log -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            # A dead renderer never recovers, so there is nothing left to wait
            # for. Bail out now with the reason instead of burning the full
            # 45s app-side timeout and then reporting the generic symptom.
            foreach ($fatal in @('render: process gone', 'boot: FAILED')) {
              if (Test-Logged $log $fatal) {
                Show-SmokeLogs
                Write-Error "fresh build reported '$fatal' during startup"
                exit 1
              }
            }
            # /api/health is answered by the Next child process, which runs fine
            # even when the Electron window never renders a page. Health alone
            # cannot tell a working app from a windowless one, so also require
            # the app's own milestone from startup.log.
            if ($healthy -and (Test-Logged $log 'window: page loaded')) {
              $up = $true
              Write-Host 'window reported the page loaded'
            }
          }
          if (-not $healthy) { Show-SmokeLogs; Write-Error 'fresh build never reported healthy'; exit 1 }
          if (-not $up) {
            Show-SmokeLogs
            Write-Error 'server healthy but the window never finished loading'
            exit 1
          }

          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*edms-archive*' } | Stop-Process -Force
          Start-Sleep -Seconds 5

          # The upgrade test below must start from a genuine first-run v1.0.0
          # install. Electron versions differ in whether --user-data-dir also
          # moves app.getPath('userData'), so clear the real path too rather
          # than assume isolation held.
          Remove-Item (Join-Path $env:APPDATA 'enterprise-edms') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Boot smoke test OK'

      # Real upgrade on a clean runner, exactly what a v1.0.0 user does:
      #   1. install + run the published v1.0.0 so it creates its database,
      #      auth secret and seeded documents in %APPDATA%
      #   2. add a user file, fingerprint every file in that data folder
      #   3. silently install the new Setup over it
      #   4. data folder must be byte-identical; the new exe must be in place
      #   5. start the new version on that data: it must stay up, and every
      #      pre-existing file must still be intact afterwards
      #
      # Every launch captures stdout/stderr and, on failure, prints both those
      # and the app's own <userData>\logs\startup.log. Without them a failed
      # boot is just an exit code — the v1.0.2 gate failed three times with
      # "exited on startup (code 0)" and no explanation anywhere.
      # A/B control for the 0xC0000005 renderer crash, on one runner, in one
      # step, so nothing environmental can differ between the two runs.
      #
      # Both builds are launched with --remote-debugging-port and judged the same
      # way: a renderer that survives and loads its page shows up in /json/list.
      # v1.0.0 has no startup.log of its own, so log-grepping cannot judge it —
      # the debug protocol can, and it works against an unmodified release.
      #
      # Never fails the job; it only reports.
      - name: DIAGNOSTIC A/B v1.0.0 vs this build, renderer alive?
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # Track a target by its debugger id, never by URL: the app redirects
          # "/" to "/login", so a URL match reports a healthy redirect as a dead
          # renderer. And "appeared once" is not alive either — the crash lands
          # ~650ms in — so the same id has to still be there 15s later.
          function Test-Renderer($exe, $label, $port) {
            $dir = Join-Path $env:RUNNER_TEMP "probe-$label"
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            $out = Join-Path $env:RUNNER_TEMP "$label-out.log"
            $err = Join-Path $env:RUNNER_TEMP "$label-err.log"
            $env:ELECTRON_ENABLE_LOGGING = '1'
            $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) `
              -ArgumentList '--disable-gpu', '--no-sandbox', "--remote-debugging-port=$port", "--user-data-dir=$dir" `
              -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $id = $null
            $seen = New-Object System.Collections.ArrayList
            for ($i = 0; $i -lt 40 -and -not $id; $i++) {
              Start-Sleep -Seconds 1
              try {
                $pages = @(Invoke-RestMethod "http://127.0.0.1:$port/json/list" -TimeoutSec 2 -ErrorAction Stop |
                  Where-Object { $_.type -eq 'page' -and $_.url -notlike 'about:*' })
                if ($pages.Count -gt 0) {
                  $id = $pages[0].id
                  [void]$seen.Add($pages[0].url)
                }
              } catch { }
            }
            $held = 0
            if ($id) {
              for ($i = 0; $i -lt 15; $i++) {
                Start-Sleep -Seconds 1
                try {
                  $still = @(Invoke-RestMethod "http://127.0.0.1:$port/json/list" -TimeoutSec 2 -ErrorAction Stop |
                    Where-Object { $_.id -eq $id })
                  if ($still.Count -eq 0) { break }
                  $held = $i + 1
                  if ($seen[$seen.Count - 1] -ne $still[0].url) { [void]$seen.Add($still[0].url) }
                } catch { break }
              }
            }
            Write-Host "[$label] target=$id held=${held}s/15 urls seen: $($seen -join '  ->  ')"
            Get-Process -Id $p.Id -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*edms-archive*' } | Stop-Process -Force
            Start-Sleep -Seconds 5
            if (Test-Path $out) { Write-Host "----- $label stdout tail -----"; Get-Content $out -Tail 8 | Out-String | Write-Host }
            if (Test-Path $err) { Write-Host "----- $label stderr tail -----"; Get-Content $err -Tail 8 | Out-String | Write-Host }
            return ($held -ge 15)
          }

          $old = Join-Path $env:RUNNER_TEMP 'EDMS-1.0.0-diag-Setup.exe'
          Invoke-WebRequest 'https://github.com/zeiad6/Edms-archive/releases/download/v1.0.0/EDMS-Archive-1.0.0-Setup-x64.exe' -OutFile $old
          Start-Process $old -ArgumentList '/S' -Wait
          $v100 = $null
          for ($i = 0; $i -lt 20 -and -not $v100; $i++) {
            foreach ($r in @("$env:LOCALAPPDATA\Programs", $env:ProgramFiles)) {
              if (-not (Test-Path $r)) { continue }
              $f = Get-ChildItem $r -Recurse -Depth 2 -Filter 'edms-archive.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($f) { $v100 = $f.FullName; break }
            }
            if (-not $v100) { Start-Sleep -Seconds 3 }
          }

          $ours = (Resolve-Path 'dist\release\win-unpacked\edms-archive.exe').Path
          Write-Host "control : $v100 ($((Get-Item $v100).VersionInfo.ProductVersion))"
          Write-Host "candidate: $ours"

          $ok100 = $false
          if ($v100) { $ok100 = Test-Renderer $v100 'v100' 9222 }
          $okOurs = Test-Renderer $ours 'ours' 9223

          Write-Host ''
          if ($ok100 -and -not $okOurs) { Write-Host 'VERDICT: v1.0.0 loads its window here, this build does not => the regression is OURS' }
          elseif (-not $ok100 -and -not $okOurs) { Write-Host 'VERDICT: neither build paints a window here => the headless agent is the constraint' }
          elseif ($ok100 -and $okOurs) { Write-Host 'VERDICT: both load => the crash is not about a painted window at all' }
          else { Write-Host 'VERDICT: only this build loads (unexpected) - re-read the logs above' }

      - name: Upgrade test (v1.0.0 -> this build keeps user data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exeName = 'edms-archive.exe'

          # Locate the installed exe on disk (per-user NSIS -> %LOCALAPPDATA%\Programs).
          # Polls because the NSIS process can return before files settle.
          function Find-Exe {
            for ($i = 0; $i -lt 20; $i++) {
              foreach ($r in @("$env:LOCALAPPDATA\Programs", $env:ProgramFiles)) {
                if (-not (Test-Path $r)) { continue }
                $f = Get-ChildItem $r -Recurse -Depth 2 -Filter $exeName -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($f) { return $f.FullName }
              }
              Start-Sleep -Seconds 3
            }
            Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall, HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall -ErrorAction SilentlyContinue |
              Get-ItemProperty | Where-Object { $_.UninstallString -match 'Uninstall' } |
              Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString | Out-String | Write-Host
            return $null
          }
          function Wait-DataDir {
            for ($i = 0; $i -lt 60; $i++) {
              $db = Get-ChildItem $env:APPDATA -Recurse -Depth 3 -Filter edms.db -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($db) { return $db.Directory.Parent.FullName }
              Start-Sleep -Seconds 3
            }
            throw 'app never created its database'
          }
          function Stop-App {
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*edms-archive*' } | Stop-Process -Force
            Start-Sleep -Seconds 5
          }
          # Launch the app with stdout/stderr captured. A packaged Electron app
          # that dies during boot has no window to screenshot and no console,
          # so these files are the only record of WHY.
          $env:ELECTRON_ENABLE_LOGGING = '1'
          function Start-App($exe) {
            # --disable-gpu / --no-sandbox: the runner has no GPU and its sandboxed
            # renderer cannot initialise, which kills it with an access
            # violation. Test launch only; the shipped app keeps both.
            $out = Join-Path $env:RUNNER_TEMP 'edms-stdout.log'
            $err = Join-Path $env:RUNNER_TEMP 'edms-stderr.log'
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            return Start-Process $exe -ArgumentList '--disable-gpu', '--no-sandbox' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          }
          function Read-Log($f) {
            try { Get-Content $f -Tail 60 -ErrorAction Stop | Out-String | Write-Host }
            catch { Write-Host "could not read $f : $($_.Exception.Message)" }
          }
          # The app keeps startup.log open for append, so a read can lose a race with a
          # write. Never let that abort the run: "not readable yet" means "not yet".
          function Test-Logged($f, $pattern) {
            if (-not $f -or -not (Test-Path $f)) { return $false }
            try { return [bool](Select-String -Path $f -Pattern $pattern -Quiet -ErrorAction Stop) }
            catch { return $false }
          }
          function Dump-AppLogs($data) {
            foreach ($f in @((Join-Path $env:RUNNER_TEMP 'edms-stdout.log'), (Join-Path $env:RUNNER_TEMP 'edms-stderr.log'))) {
              if (Test-Path $f) { Write-Host "----- $(Split-Path $f -Leaf) -----"; Read-Log $f }
            }
            # Written by electron/main.cjs logStartup() — survives the crash.
            $sl = if ($data) { Join-Path $data 'logs\startup.log' } else { $null }
            if ($sl -and (Test-Path $sl)) {
              Write-Host "----- startup.log ($sl) -----"
              Read-Log $sl
            } else {
              Write-Host "no startup.log at $($sl)"
            }
            # A 0xC0000005 renderer death carries no reason in Electron's own
            # output; the faulting module only exists in the Windows event log.
            try {
              $evts = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction Stop |
                Where-Object { $_.Id -in 1000, 1001, 1026 } | Select-Object -First 8
              if (-not $evts) { Write-Host 'no Application Error events in the last 15 minutes' }
              foreach ($e in $evts) {
                $first = ($e.Message -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -First 4) -join ' | '
                Write-Host "event $($e.Id): $first"
              }
            } catch { Write-Host "could not read the Application event log: $($_.Exception.Message)" }
          }
          function Get-Fingerprint($dir) {
            Get-ChildItem $dir -Recurse -File |
              Where-Object { $_.FullName -notmatch '\\(Cache|Code Cache|GPUCache|DawnCache|DawnGraphiteCache|DawnWebGPUCache|Session Storage|Local Storage|Network|Shared Dictionary|blob_storage|Crashpad|logs)\\' -and $_.Name -notmatch '(-wal|-shm|\.log|Preferences|Local State|lockfile|LOCK|LOG|LOG\.old)$' } |
              ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash, $_.FullName.Substring($dir.Length) } |
              Sort-Object
          }

          # 1. v1.0.0
          $old = Join-Path $env:RUNNER_TEMP 'EDMS-1.0.0-Setup.exe'
          Invoke-WebRequest 'https://github.com/zeiad6/Edms-archive/releases/download/v1.0.0/EDMS-Archive-1.0.0-Setup-x64.exe' -OutFile $old
          Start-Process $old -ArgumentList '/S' -Wait
          $exe = Find-Exe
          if (-not $exe) { throw 'v1.0.0 did not install' }
          Write-Host "v1.0.0 installed: $exe ($((Get-Item $exe).VersionInfo.ProductVersion))"
          Start-Process $exe
          $data = Wait-DataDir
          Start-Sleep -Seconds 20   # let the first-boot seed finish writing
          Stop-App
          Write-Host "user data dir: $data"

          # 2. user content
          $marker = Join-Path $data 'storage\documents\user-file-from-1.0.0.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $marker) | Out-Null
          Set-Content -Path $marker -Value 'ملف المستخدم من الإصدار 1.0.0' -Encoding utf8
          $before = Get-Fingerprint $data
          Write-Host "fingerprinted $($before.Count) files"
          if ($before.Count -lt 3) { throw 'v1.0.0 data folder unexpectedly empty' }

          # 3. upgrade
          $new = (Get-ChildItem dist/release/EDMS-Archive-*-Setup-x64.exe | Select-Object -First 1).FullName
          Start-Process $new -ArgumentList '/S' -Wait

          # 4. installer must not touch user data
          $afterInstall = Get-Fingerprint $data
          $diff = Compare-Object $before $afterInstall
          if ($diff) { $diff | Format-Table -AutoSize | Out-String | Write-Host; throw 'installer changed user data' }
          $exe = Find-Exe
          if (-not $exe) { throw 'new version not found after upgrade' }
          $got = (Get-Item $exe).VersionInfo.ProductVersion
          if ($got -notlike "$version*") { throw "expected $version installed, found $got" }
          Write-Host "upgraded in place to $got; data untouched"

          # 5. new version boots on the old data. "Process alive" is not
          # enough (a main-process crash leaves an error dialog open), so wait
          # for the bundled server and require /api/health to answer ok —
          # that route opens the migrated DB and runs the seed/migrations.
          #
          # Any leftover edms process would make the new build exit 0 by design
          # (single-instance handover), so the runner is swept first.
          Stop-App
          # A leftover milestone from a previous attempt (or from the v1.0.0 run
          # below) must not be able to satisfy this gate — start from a clean
          # log so the match can only come from this build.
          Remove-Item (Join-Path $data 'logs\startup.log') -Force -ErrorAction SilentlyContinue
          $proc = Start-App $exe
          $startupLog = Join-Path $data 'logs\startup.log'
          $healthy = $false
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              $code = $proc.ExitCode
              # Exit 0 that ends in a "lock DENIED" line is the single-instance
              # handover, not a crash: a stale process still held the lock even
              # after the sweep. Retry rather than fail the release on it.
              $handover = $code -eq 0 -and (Test-Logged $startupLog 'lock DENIED')
              if ($handover -and $i -lt 3) {
                Write-Host "single-instance handover (exit 0) on attempt $($i + 1) — sweeping and retrying"
                Dump-AppLogs $data
                Stop-App
                Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
                $proc = Start-App $exe
                continue
              }
              Dump-AppLogs $data
              throw "new version exited on startup (code $code)"
            }
            $pids = (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*edms-archive*' }).Id
            $ports = Get-NetTCPConnection -State Listen -LocalAddress 127.0.0.1 -ErrorAction SilentlyContinue |
              Where-Object { $pids -contains $_.OwningProcess } | Select-Object -ExpandProperty LocalPort -Unique
            foreach ($port in $ports) {
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 10
                if ($r.ok) { if (-not $healthy) { Write-Host "health ok on port $port" }; $healthy = $true }
              } catch { }
            }
            # A dead renderer never recovers, so fail with the reason instead of
            # waiting out the 45s app-side timeout.
            foreach ($fatal in @('render: process gone', 'boot: FAILED')) {
              if (Test-Logged $startupLog $fatal) {
                Dump-AppLogs $data
                throw "upgraded build reported '$fatal' during startup"
              }
            }
            # Same trap as the smoke gate: health is answered by the Next child
            # and says nothing about the window. Require the milestone too, and
            # keep looping until both are true — breaking out on health alone
            # would pass a build whose server is fine but whose window is dead.
            if ($healthy -and (Test-Logged $startupLog 'window: page loaded')) {
              $up = $true
              Write-Host 'window reported the page loaded'
            }
          }
          if (-not $up) {
            Dump-AppLogs $data
            if ($healthy) { throw 'upgraded build served /api/health but the window never finished loading' }
            throw 'new version never reported healthy with a loaded window on the upgraded data'
          }
          Stop-App
          $afterBoot = Get-Fingerprint $data
          $missing = Compare-Object $before $afterBoot | Where-Object SideIndicator -eq '<=' |
            Where-Object { $_.InputObject -notmatch '\\data\\edms\.db$' }
          if ($missing) { $missing | Format-Table -AutoSize | Out-String | Write-Host; throw 'new version altered or removed existing files' }
          if (-not (Test-Path $marker)) { throw 'user file lost' }
          Write-Host 'Upgrade test OK'

      - name: Create GitHub Release (UTF-8 Arabic body)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/release/EDMS-Archive-*-Setup-x64.exe
            dist/release/EDMS-Archive-*-Setup-x64.exe.blockmap
            dist/release/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: false
