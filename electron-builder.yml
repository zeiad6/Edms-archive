# EDMS — electron-builder configuration (Windows x64 NSIS installer).
appId: sa.edms.archive
productName: أرشيف
copyright: Copyright © 2026 — وزارة التخطيط (مثال)
electronVersion: 43.4.0

# The packaged app loads its REAL main from dist/electron/main.cjs (obfuscated
# copy staged by build-electron.cjs); package.json's `main` stays pointing at
# electron/main.cjs for direct dev runs.
extraMetadata:
  main: dist/electron/main.cjs

directories:
  output: dist/release
  buildResources: resources

# IMPORTANT: `files` patterns are ADDED to the implicit default (**/*), they
# do not replace it. An explicit negative pattern must come first or the
# whole node_modules tree ends up inside app.asar.
files:
  - "!**/*"
  - "dist/electron/**/*"
  - "dist/resources/**/*"
  - "package.json"
  # electron-updater + its runtime deps must ship INSIDE the asar so the
  # obfuscated main.cjs can require("electron-updater") for auto-updates.
  - "node_modules/electron-updater/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/fs-extra/**/*"
  - "node_modules/js-yaml/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/tiny-typed-emitter/**/*"
  - "node_modules/graceful-fs/**/*"
  - "node_modules/jsonfile/**/*"
  - "node_modules/universalify/**/*"
  - "node_modules/argparse/**/*"
  - "node_modules/sprintf-js/**/*"
  - "node_modules/esprima/**/*"
  - "node_modules/debug/**/*"
  - "node_modules/ms/**/*"
  - "node_modules/sax/**/*"

# The Next standalone server (server.js + node_modules) must stay readable on
# disk because it is spawned as a child process (ELECTRON_RUN_AS_NODE) — Node
# cannot exec from inside an asar, and electron-builder prunes node_modules
# from extraResources. So it is NOT packaged via electron-builder at all:
# scripts/after-pack.cjs copies dist/standalone -> resources/standalone
# directly into the unpacked app after packaging.
afterPack: scripts/after-pack.cjs

# Everything writable lives in userData — the scan script and env are shipped
# OUTSIDE the asar so the child process can exec them.
extraResources:
  - from: dist/resources
    to: .

asar: true

# Ship only the locales the UI actually uses; the default 46 MB of Chromium
# .pak files is pure dead weight for this app.
electronLanguages:
  - ar
  - en
# Auto-update channel — GitHub releases of zeiad6/Edms-archive.
# electron-updater reads the latest release (latest.yml + Setup exe attached
# to the GitHub release) without any token for public repos. The app only
# NOTIFIES and opens the releases page — no silent install (unsigned builds).
publish:
  provider: github
  owner: zeiad6
  repo: Edms-archive
  private: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    # Extract-once ZIP: the portable SFX re-extracts ~520 MB to %TEMP% on EVERY
    # launch (minutes of silence on slow disks) — the ZIP is unpacked once and
    # then starts instantly. Recommended over the Portable exe for daily use.
    - target: zip
      arch:
        - x64
  icon: resources/icon/icon.ico
  executableName: edms-archive
  # NOTE: artifact names MUST stay Latin-only. productName is Arabic (أرشيف)
  # and using ${productName} here produced mangled "?????-1.0.0-Setup-x64.exe"
  # filenames that broke GitHub release assets + direct download links.
  # NOTE: ${target} is only defined for nsis/portable — the zip target does
  # not provide it, so the win-level default must NOT use ${target} (nsis and
  # portable override it below with their own names).
  artifactName: EDMS-Archive-${version}-win-${arch}.${ext}

portable:
  artifactName: EDMS-Archive-${version}-Portable-${arch}.${ext}
  # Stable temp subdir (instead of a random ksuid per build) + a splash bitmap
  # shown WHILE the ~520 MB payload extracts — without it the exe shows
  # nothing for minutes and looks broken. BMP must be 24-bit; see
  # scripts/gen-splash.ps1 to regenerate resources/splash.bmp.
  unpackDirName: edms-archive-portable
  splashImage: resources/splash.bmp

# NOTE: artifact names MUST stay Latin-only (see comment on win.artifactName).
# The zip target reuses win.artifactName -> EDMS-Archive-<version>-zip-<arch>.zip.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: أرشيف
  uninstallDisplayName: أرشيف — إزالة التثبيت
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon/icon.ico
  uninstallerIcon: resources/icon/icon.ico
  artifactName: EDMS-Archive-${version}-Setup-${arch}.${ext}
  # Custom installer logic: detects a previous installation (same version ->
  # abort; older version -> update in place). See build/installer.nsi.
  include: build/installer.nsi

# Windows code signing: set CSC_LINK=<path/to/cert.pfx> + CSC_KEY_PASSWORD=<pwd> env vars
# (or Azure Trusted Signing via CSC_LINK=AzureKeyVault://...); unsigned builds show SmartScreen warning.
# win:
#   certificateFile: cert.pfx
#   certificatePassword: ''
# Native ABI note: @libsql/client + sharp ship prebuilt win32-x64 binaries; keep npmRebuild=false
# and rebuild explicitly via `npm run electron:rebuild` (electron-rebuild -f -w @libsql/client,sharp)
# after `npm ci` on the packaging host to avoid ABI mismatch with Electron 43.
compression: maximum
npmRebuild: false
